<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Raja Legend – Moderation</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0a;
      color: #00ffc8;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 700px;
      width: 100%;
      background: #111;
      border: 2px solid #00ffc8;
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 0 30px rgba(0,255,200,0.15);
    }
    .header {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-word;
      color: #00ffc8;
      text-shadow: 0 0 10px #00ffc866;
      border-bottom: 1px solid #00ffc844;
      padding-bottom: 16px;
      margin-bottom: 20px;
      line-height: 1.6;
      animation: glitch 3s infinite;
    }
    @keyframes glitch {
      0% { text-shadow: 2px 0 #ff00c8, -2px 0 #00ffff; }
      25% { text-shadow: -2px 0 #ff00c8, 2px 0 #00ffff; }
      50% { text-shadow: 2px 2px #ff00c8, -2px -2px #00ffff; }
      75% { text-shadow: -2px -2px #ff00c8, 2px 2px #00ffff; }
      100% { text-shadow: 0 0 #ff00c8, 0 0 #00ffff; }
    }

    .auth-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      background: #0d0d0d;
      border: 1px solid #00ffc844;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 16px;
    }
    .auth-section .status {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .auth-section .status .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4466;
    }
    .auth-section .status .dot.connected {
      background: #00ffc8;
      box-shadow: 0 0 15px #00ffc8;
    }
    .auth-section .btn-small {
      padding: 6px 16px;
      border: 1px solid #00ffc8;
      border-radius: 20px;
      background: transparent;
      color: #00ffc8;
      cursor: pointer;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 1px;
      transition: 0.2s;
    }
    .auth-section .btn-small:hover {
      background: #00ffc822;
    }
    .auth-section .btn-small.logout {
      border-color: #ff4466;
      color: #ff4466;
    }
    .auth-section .btn-small.logout:hover {
      background: #ff446622;
    }

    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ffc8aa;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background: #1a1a1a;
      border: 1px solid #00ffc866;
      border-radius: 8px;
      color: #00ffc8;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    input:focus, select:focus {
      border-color: #00ffc8;
      box-shadow: 0 0 12px #00ffc844;
      background: #000;
    }
    input::placeholder { color: #00ffc866; }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 16px 0;
    }
    .btn {
      flex: 1;
      padding: 14px 10px;
      border: 2px solid #00ffc8;
      border-radius: 8px;
      background: transparent;
      color: #00ffc8;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.25s;
      min-width: 100px;
    }
    .btn:hover {
      background: #00ffc822;
      box-shadow: 0 0 20px #00ffc844;
    }
    .btn:active { transform: scale(0.96); }
    .btn-start { background: #00ffc822; border-color: #00ffc8; }
    .btn-start:hover { background: #00ffc844; }
    .btn-stop { border-color: #ff4466; color: #ff4466; }
    .btn-stop:hover { background: #ff446622; box-shadow: 0 0 20px #ff446644; }
    .btn-manual { border-color: #ffaa00; color: #ffaa00; background: #ffaa0022; }
    .btn-manual:hover { background: #ffaa0044; box-shadow: 0 0 20px #ffaa0044; }
    .btn:disabled { opacity: 0.4; pointer-events: none; filter: grayscale(0.5); }

    .monitor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      background: #0d0d0d;
      border: 1px solid #00ffc844;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
      font-size: 0.9rem;
    }
    .monitor-grid .item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .monitor-grid .item .label { color: #00ffc8aa; }
    .monitor-grid .item .value { font-weight: bold; color: #00ffc8; }
    .monitor-grid .status-indicator {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #00ffc833;
      margin-bottom: 4px;
    }
    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4466;
      transition: 0.3s;
    }
    .status-dot.running {
      background: #00ffc8;
      box-shadow: 0 0 20px #00ffc8;
    }
    .status-text {
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem;
    }
    .status-text.running { color: #00ffc8; }
    .status-text.stopped { color: #ff4466; }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin: 12px 0;
      max-height: 250px;
      overflow-y: auto;
      padding: 4px;
    }
    .media-item {
      background: #1a1a1a;
      border: 1px solid #00ffc844;
      border-radius: 8px;
      padding: 6px;
      text-align: center;
      font-size: 0.7rem;
      transition: 0.2s;
    }
    .media-item img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
      background: #000;
    }
    .media-item .caption {
      color: #00ffc8aa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 4px;
    }
    .media-item .report-link {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      border: 1px solid #ffaa00;
      border-radius: 12px;
      color: #ffaa00;
      font-size: 0.6rem;
      text-decoration: none;
      text-transform: uppercase;
    }
    .media-item .report-link:hover {
      background: #ffaa0022;
    }

    .log-container {
      margin-top: 20px;
      border-top: 1px solid #00ffc844;
      padding-top: 16px;
    }
    .log-container .log-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ffc8aa;
      margin-bottom: 8px;
    }
    .log-box {
      background: #0a0a0a;
      border: 1px solid #00ffc833;
      border-radius: 8px;
      padding: 10px 14px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #00ffc8bb;
    }
    .log-box .log-entry { padding: 2px 0; border-bottom: 1px solid #00ffc811; }
    .log-box .log-entry .time { color: #00ffc866; margin-right: 10px; }

    .log-box::-webkit-scrollbar { width: 5px; }
    .log-box::-webkit-scrollbar-track { background: #1a1a1a; }
    .log-box::-webkit-scrollbar-thumb { background: #00ffc866; border-radius: 10px; }

    @media (max-width: 480px) {
      .container { padding: 16px 12px; }
      .header { font-size: 0.9rem; }
      .btn { font-size: 0.8rem; padding: 12px 6px; min-width: 70px; }
      .monitor-grid { grid-template-columns: 1fr; }
      .media-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    ◄⸻̅͟ˣ͠𓆩𝐑꯭꘍꯭֟፝͡᪂꘍꯭ 𝐋꯭𖾝ԍ𖾝꯭֟፝͡᎔꯭𑀘𓆪꯭ˣ͢
  </div>

  <!-- AUTH SECTION -->
  <div class="auth-section">
    <div class="status">
      <span class="dot" id="authDot"></span>
      <span id="authStatus">Not connected</span>
    </div>
    <div>
      <button class="btn-small" id="loginBtn">🔑 Connect</button>
      <button class="btn-small logout" id="logoutBtn" style="display:none;">Logout</button>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="field">
    <label for="interval">Polling Interval (seconds)</label>
    <input type="number" id="interval" value="10" min="2" step="1">
  </div>

  <div class="btn-group">
    <button class="btn btn-start" id="startBtn">▶ START</button>
    <button class="btn btn-stop" id="stopBtn" disabled>⏹ STOP</button>
  </div>

  <!-- LIVE MONITOR -->
  <div class="monitor-grid">
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text stopped" id="statusText">STOPPED</span>
    </div>
    <div class="item">
      <span class="label">Next fetch</span>
      <span class="value" id="countdownDisplay">--</span>
    </div>
    <div class="item">
      <span class="label">Elapsed</span>
      <span class="value" id="elapsedDisplay">00:00:00</span>
    </div>
    <div class="item">
      <span class="label">Cycles</span>
      <span class="value" id="cyclesDisplay">0</span>
    </div>
    <div class="item">
      <span class="label">Interval</span>
      <span class="value" id="intervalDisplay">10s</span>
    </div>
  </div>

  <!-- MEDIA GALLERY -->
  <div style="margin-top:12px;">
    <label style="font-size:0.8rem; text-transform:uppercase; color:#00ffc8aa;">Recent Media</label>
    <div class="media-grid" id="mediaGrid">
      <div style="grid-column:1/-1; text-align:center; color:#00ffc866;">No media loaded – start polling or connect account.</div>
    </div>
  </div>

  <!-- LOG -->
  <div class="log-container">
    <div class="log-title">📋 Activity Log</div>
    <div class="log-box" id="logBox">
      <div class="log-entry"><span class="time">[init]</span> Ready.</div>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  // DOM refs
  const authDot = document.getElementById('authDot');
  const authStatus = document.getElementById('authStatus');
  const loginBtn = document.getElementById('loginBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const intervalInput = document.getElementById('interval');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const countdownDisplay = document.getElementById('countdownDisplay');
  const elapsedDisplay = document.getElementById('elapsedDisplay');
  const cyclesDisplay = document.getElementById('cyclesDisplay');
  const intervalDisplay = document.getElementById('intervalDisplay');
  const mediaGrid = document.getElementById('mediaGrid');
  const logBox = document.getElementById('logBox');

  let running = false;
  let authenticated = false;

  // ---------- Fetch state ----------
  function fetchState() {
    fetch('/state')
      .then(res => res.json())
      .then(data => {
        // Auth
        authenticated = data.authenticated;
        if (authenticated && data.user && data.user.username) {
          authDot.className = 'dot connected';
          authStatus.textContent = `@${data.user.username}`;
          loginBtn.style.display = 'none';
          logoutBtn.style.display = 'inline-block';
        } else {
          authDot.className = 'dot';
          authStatus.textContent = 'Not connected';
          loginBtn.style.display = 'inline-block';
          logoutBtn.style.display = 'none';
        }

        // Running
        running = data.running;
        if (running) {
          statusDot.className = 'status-dot running';
          statusText.textContent = '● RUNNING';
          statusText.className = 'status-text running';
          startBtn.disabled = true;
          stopBtn.disabled = false;
        } else {
          statusDot.className = 'status-dot';
          statusText.textContent = 'STOPPED';
          statusText.className = 'status-text stopped';
          startBtn.disabled = false;
          stopBtn.disabled = true;
        }

        countdownDisplay.textContent = running ? data.countdown : '--';
        elapsedDisplay.textContent = data.elapsed || '00:00:00';
        cyclesDisplay.textContent = data.cycles || 0;
        intervalDisplay.textContent = (data.interval || 10) + 's';

        // Media
        renderMedia(data.media || []);

        // Logs
        renderLogs(data.logs || []);
      })
      .catch(err => console.error('State fetch error:', err));
  }

  function renderMedia(media) {
    mediaGrid.innerHTML = '';
    if (!media || media.length === 0) {
      mediaGrid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:#00ffc866;">No media – start polling.</div>';
      return;
    }
    media.forEach(item => {
      const div = document.createElement('div');
      div.className = 'media-item';
      const imgSrc = item.media_url || '';
      const caption = item.caption || 'No caption';
      const permalink = item.permalink || '#';
      div.innerHTML = `
        <img src="${imgSrc}" alt="Media" onerror="this.style.display='none'">
        <div class="caption">${caption.substring(0,20)}${caption.length>20?'…':''}</div>
        <a href="${permalink}" target="_blank" class="report-link">View on Instagram</a>
      `;
      mediaGrid.appendChild(div);
    });
  }

  function renderLogs(logs) {
    logBox.innerHTML = '';
    if (!logs || logs.length === 0) {
      logBox.innerHTML = '<div class="log-entry"><span class="time">[init]</span> No activity.</div>';
      return;
    }
    logs.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.innerHTML = `<span class="time">[${entry.time}]</span> ${entry.msg}`;
      logBox.appendChild(div);
    });
  }

  // ---------- Actions ----------
  function startPolling() {
    const interval = parseInt(intervalInput.value, 10);
    if (isNaN(interval) || interval < 1) {
      alert('Interval must be at least 1 second.');
      return;
    }
    fetch('/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ interval })
    })
      .then(res => res.json())
      .then(() => fetchState())
      .catch(err => console.error('Start error:', err));
  }

  function stopPolling() {
    fetch('/stop', { method: 'POST' })
      .then(res => res.json())
      .then(() => fetchState())
      .catch(err => console.error('Stop error:', err));
  }

  function login() {
    window.location.href = '/login';
  }

  function logout() {
    window.location.href = '/logout';
  }

  // ---------- Polling ----------
  setInterval(fetchState, 1000);

  // ---------- Event listeners ----------
  startBtn.addEventListener('click', startPolling);
  stopBtn.addEventListener('click', stopPolling);
  loginBtn.addEventListener('click', login);
  logoutBtn.addEventListener('click', logout);

  // Initial load
  fetchState();
})();
</script>
</body>
</html>
