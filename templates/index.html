<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Raja Legend</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0a0a;
      color: #00ffc8;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
      background: #111;
      border: 2px solid #00ffc8;
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 0 30px rgba(0,255,200,0.15);
    }
    .header {
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-word;
      color: #00ffc8;
      text-shadow: 0 0 10px #00ffc866;
      border-bottom: 1px solid #00ffc844;
      padding-bottom: 16px;
      margin-bottom: 20px;
      line-height: 1.6;
      animation: glitch 3s infinite;
    }
    @keyframes glitch {
      0% { text-shadow: 2px 0 #ff00c8, -2px 0 #00ffff; }
      25% { text-shadow: -2px 0 #ff00c8, 2px 0 #00ffff; }
      50% { text-shadow: 2px 2px #ff00c8, -2px -2px #00ffff; }
      75% { text-shadow: -2px -2px #ff00c8, 2px 2px #00ffff; }
      100% { text-shadow: 0 0 #ff00c8, 0 0 #00ffff; }
    }

    .field { margin-bottom: 18px; }
    label {
      display: block;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ffc8aa;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      background: #1a1a1a;
      border: 1px solid #00ffc866;
      border-radius: 8px;
      color: #00ffc8;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
    }
    input:focus, select:focus {
      border-color: #00ffc8;
      box-shadow: 0 0 12px #00ffc844;
      background: #000;
    }
    input::placeholder { color: #00ffc866; }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 20px 0 16px;
    }
    .btn {
      flex: 1;
      padding: 14px 10px;
      border: 2px solid #00ffc8;
      border-radius: 8px;
      background: transparent;
      color: #00ffc8;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: 0.25s;
      min-width: 100px;
    }
    .btn:hover {
      background: #00ffc822;
      box-shadow: 0 0 20px #00ffc844;
    }
    .btn:active { transform: scale(0.96); }
    .btn-start { background: #00ffc822; border-color: #00ffc8; }
    .btn-start:hover { background: #00ffc844; }
    .btn-stop { border-color: #ff4466; color: #ff4466; }
    .btn-stop:hover { background: #ff446622; box-shadow: 0 0 20px #ff446644; }
    .btn-manual { border-color: #ffaa00; color: #ffaa00; background: #ffaa0022; }
    .btn-manual:hover { background: #ffaa0044; box-shadow: 0 0 20px #ffaa0044; }
    .btn-clear { border-color: #ff66aa; color: #ff66aa; background: #ff66aa22; }
    .btn-clear:hover { background: #ff66aa44; }
    .btn:disabled { opacity: 0.4; pointer-events: none; filter: grayscale(0.5); }

    .monitor-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
      background: #0d0d0d;
      border: 1px solid #00ffc844;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 12px 0;
      font-size: 0.9rem;
    }
    .monitor-grid .item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .monitor-grid .item .label { color: #00ffc8aa; }
    .monitor-grid .item .value { font-weight: bold; color: #00ffc8; }
    .monitor-grid .status-indicator {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid #00ffc833;
      margin-bottom: 4px;
    }
    .status-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff4466;
      transition: 0.3s;
    }
    .status-dot.running {
      background: #00ffc8;
      box-shadow: 0 0 20px #00ffc8;
    }
    .status-text {
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.9rem;
    }
    .status-text.running { color: #00ffc8; }
    .status-text.stopped { color: #ff4466; }

    .target-status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
      background: #555;
      transition: 0.3s;
    }
    .target-status-dot.ready {
      background: #00ffc8;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.4; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ---------- HISTORY SECTION ---------- */
    .history-section {
      margin-top: 24px;
      border-top: 1px solid #00ffc844;
      padding-top: 16px;
    }
    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .history-header .title {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #00ffc8aa;
    }
    .history-header .total {
      font-size: 1.2rem;
      font-weight: bold;
      color: #00ffc8;
    }
    .history-box {
      background: #0a0a0a;
      border: 1px solid #00ffc833;
      border-radius: 8px;
      padding: 8px 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #00ffc8bb;
    }
    .history-box .entry {
      padding: 3px 0;
      border-bottom: 1px solid #00ffc811;
      font-family: 'Courier New', monospace;
    }
    .history-box .entry .time {
      color: #00ffc866;
      margin-right: 12px;
    }
    .history-box .entry .cycle {
      color: #00ffc8;
      margin-right: 12px;
    }
    .history-box .entry .user {
      color: #ffaa00;
    }
    .history-box::-webkit-scrollbar { width: 5px; }
    .history-box::-webkit-scrollbar-track { background: #1a1a1a; }
    .history-box::-webkit-scrollbar-thumb { background: #00ffc866; border-radius: 10px; }

    .history-actions {
      display: flex;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .history-actions .btn {
      flex: 0 1 auto;
      padding: 8px 16px;
      font-size: 0.8rem;
      min-width: auto;
    }

    @media (max-width: 480px) {
      .container { padding: 16px 12px; }
      .header { font-size: 0.9rem; }
      .btn { font-size: 0.8rem; padding: 12px 6px; min-width: 70px; }
      .monitor-grid { grid-template-columns: 1fr; }
      .history-header .total { font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    ◄⸻̅͟ˣ͠𓆩𝐑꯭꘍꯭֟፝͡᪂꘍꯭ 𝐋꯭𖾝ԍ𖾝꯭֟፝͡᎔꯭𑀘𓆪꯭ˣ͢
  </div>

  <!-- TARGET INPUT -->
  <div class="field">
    <label for="username">Target Instagram Username</label>
    <input type="text" id="username" placeholder="e.g. @rk979633" value="">
  </div>

  <!-- CONTROLS -->
  <div class="field">
    <label for="interval">Interval (seconds)</label>
    <input type="number" id="interval" value="10" min="1" step="1">
  </div>

  <div class="btn-group">
    <button class="btn btn-start" id="startBtn">▶ START</button>
    <button class="btn btn-stop" id="stopBtn" disabled>⏹ STOP</button>
    <button class="btn btn-manual" id="manualBtn">🔗 OPEN INSTAGRAM</button>
  </div>

  <!-- LIVE MONITOR -->
  <div class="monitor-grid" id="monitor">
    <div class="status-indicator">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text stopped" id="statusText">STOPPED</span>
    </div>
    <div class="item">
      <span class="label">TARGET STATUS</span>
      <span class="value" id="targetStatusDisplay">
        <span class="target-status-dot" id="targetDot"></span>
        <span id="targetStatusText">○ TARGET NOT SET</span>
      </span>
    </div>
    <div class="item">
      <span class="label">TARGET</span>
      <span class="value" id="targetDisplay">—</span>
    </div>
    <div class="item">
      <span class="label">Next cycle</span>
      <span class="value" id="countdownDisplay">--</span>
    </div>
    <div class="item">
      <span class="label">Elapsed</span>
      <span class="value" id="elapsedDisplay">00:00:00</span>
    </div>
    <div class="item">
      <span class="label">Cycles</span>
      <span class="value" id="cyclesDisplay">0</span>
    </div>
    <div class="item">
      <span class="label">Interval</span>
      <span class="value" id="intervalDisplay">10s</span>
    </div>
  </div>

  <!-- HISTORY SECTION -->
  <div class="history-section">
    <div class="history-header">
      <span class="title">📋 ACTIVITY HISTORY</span>
      <span class="total">TOTAL: <span id="totalCycles">0</span></span>
    </div>
    <div class="history-box" id="historyBox">
      <div class="entry"><span class="time">[init]</span> No cycles yet.</div>
    </div>
    <div class="history-actions">
      <button class="btn btn-clear" id="clearHistoryBtn">🗑 CLEAR HISTORY</button>
    </div>
  </div>

</div>

<script>
(function() {
  'use strict';

  // DOM refs
  const usernameInput = document.getElementById('username');
  const intervalInput = document.getElementById('interval');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const manualBtn = document.getElementById('manualBtn');
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');

  const targetDot = document.getElementById('targetDot');
  const targetStatusText = document.getElementById('targetStatusText');
  const targetDisplay = document.getElementById('targetDisplay');

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const countdownDisplay = document.getElementById('countdownDisplay');
  const elapsedDisplay = document.getElementById('elapsedDisplay');
  const cyclesDisplay = document.getElementById('cyclesDisplay');
  const intervalDisplay = document.getElementById('intervalDisplay');
  const totalCyclesSpan = document.getElementById('totalCycles');
  const historyBox = document.getElementById('historyBox');

  let running = false;
  let currentCleanedTarget = '';

  // ---------- Update target status live ----------
  function updateTargetStatus() {
    const raw = usernameInput.value;
    let cleaned = raw.trim().replace(/^@+/, '');
    const valid = /^[a-zA-Z0-9_.]+$/.test(cleaned);

    let statusMsg, dotClass, displayName;

    if (cleaned === '') {
      statusMsg = '○ TARGET NOT SET';
      dotClass = '';
      displayName = '—';
      currentCleanedTarget = '';
    } else if (!valid) {
      statusMsg = '⚠ INVALID USERNAME';
      dotClass = '';
      displayName = '@' + cleaned;
      currentCleanedTarget = '';
    } else {
      statusMsg = '● TARGET READY';
      dotClass = 'ready';
      displayName = '@' + cleaned;
      currentCleanedTarget = cleaned;
    }

    targetDot.className = 'target-status-dot ' + dotClass;
    targetStatusText.textContent = statusMsg;
    targetDisplay.textContent = displayName;
  }

  usernameInput.addEventListener('input', updateTargetStatus);

  // ---------- Fetch state ----------
  function fetchState() {
    fetch('/state')
      .then(res => res.json())
      .then(data => {
        running = data.running;
        // Status
        if (running) {
          statusDot.className = 'status-dot running';
          statusText.textContent = '● RUNNING';
          statusText.className = 'status-text running';
          startBtn.disabled = true;
          stopBtn.disabled = false;
        } else {
          statusDot.className = 'status-dot';
          statusText.textContent = 'STOPPED';
          statusText.className = 'status-text stopped';
          startBtn.disabled = false;
          stopBtn.disabled = true;
        }

        countdownDisplay.textContent = running ? data.countdown : '--';
        elapsedDisplay.textContent = data.elapsed || '00:00:00';
        cyclesDisplay.textContent = data.cycles || 0;
        intervalDisplay.textContent = (data.interval || 10) + 's';
        totalCyclesSpan.textContent = data.cycles || 0;

        // Render history
        renderHistory(data.history || []);
      })
      .catch(err => console.error('State fetch error:', err));
  }

  function renderHistory(history) {
    historyBox.innerHTML = '';
    if (!history || history.length === 0) {
      historyBox.innerHTML = '<div class="entry"><span class="time">[init]</span> No cycles yet.</div>';
      return;
    }
    history.forEach(entry => {
      const div = document.createElement('div');
      div.className = 'entry';
      div.innerHTML = `
        <span class="time">${entry.time}</span>
        <span class="cycle">Cycle #${entry.cycle}</span>
        <span class="user">@${entry.username}</span>
      `;
      historyBox.appendChild(div);
    });
  }

  // ---------- START ----------
  function startCycle() {
    const target = currentCleanedTarget;
    if (!target) {
      alert('Please enter a valid Instagram username (letters, numbers, underscore, period).');
      return;
    }
    const interval = parseInt(intervalInput.value, 10);
    if (isNaN(interval) || interval < 1) {
      alert('Interval must be at least 1 second.');
      return;
    }

    fetch('/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ target, interval })
    })
      .then(res => res.json())
      .then(() => fetchState())
      .catch(err => console.error('Start error:', err));
  }

  // ---------- STOP ----------
  function stopCycle() {
    fetch('/stop', { method: 'POST' })
      .then(res => res.json())
      .then(() => fetchState())
      .catch(err => console.error('Stop error:', err));
  }

  // ---------- OPEN INSTAGRAM ----------
  function openInstagram() {
    const target = currentCleanedTarget;
    if (!target) {
      alert('Please enter a valid username first.');
      return;
    }
    window.open(`https://www.instagram.com/${target}/`, '_blank');
  }

  // ---------- CLEAR HISTORY ----------
  function clearHistory() {
    if (confirm('Clear all history entries?')) {
      fetch('/clear_history', { method: 'POST' })
        .then(res => res.json())
        .then(() => fetchState())
        .catch(err => console.error('Clear history error:', err));
    }
  }

  // ---------- Polling ----------
  setInterval(fetchState, 1000);

  // ---------- Event listeners ----------
  startBtn.addEventListener('click', startCycle);
  stopBtn.addEventListener('click', stopCycle);
  manualBtn.addEventListener('click', openInstagram);
  clearHistoryBtn.addEventListener('click', clearHistory);

  // Initial load
  updateTargetStatus();
  fetchState();
})();
</script>
</body>
</html>
